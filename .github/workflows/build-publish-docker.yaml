name: build-publish-docker
on:
  workflow_dispatch
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Debug Environment
        run: |
          echo "Java Version:"
          java -version
          echo "Gradle Version:"
          ./gradlew --version
          echo "Current Directory Contents:"
          ls -lah

      - name: Build with Gradle
        id: build-gradle
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/placeholder_db
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: ./gradlew build -x test
        continue-on-error: true

      - name: Upload Test Reports (if tests fail)
        if: steps.build-gradle.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build API Docker image
        run: docker build -t "${{ secrets.DOCKER_USERNAME }}/api_projet:latest" -f Dockerfile .

      - name: Build DB Docker image
        run: docker build -t "${{ secrets.DOCKER_USERNAME }}/db_projet:latest" -f src/db/Dockerfile .

      - name: List Docker images
        run: docker images

      - name: Push API Docker image
        run: docker push "${{ secrets.DOCKER_USERNAME }}/api_projet:latest"

      - name: Push DB Docker image
        run: docker push "${{ secrets.DOCKER_USERNAME }}/db_projet:latest"